spring.application.name=backend
server.servlet.context-path=/api/v1

management.endpoints.web.exposure.include=health,info

app.security.jwt.secret=${APP_SECURITY_JWT_SECRET:change-this-local-development-secret-with-at-least-32-bytes}
app.security.jwt.access-token-minutes=${APP_SECURITY_JWT_ACCESS_TOKEN_MINUTES:15}
app.security.refresh-token-days=${APP_SECURITY_REFRESH_TOKEN_DAYS:30}

spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5432/candidate_upskill}
spring.datasource.username=${DATABASE_USERNAME:candidate_upskill}
spring.datasource.password=${DATABASE_PASSWORD:candidate_upskill}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.data.redis.repositories.enabled=false
