openapi: 3.1.0
info:
  title: Candidate Upskill API
  version: 0.1.0
  description: MVP API contract for backend and mobile collaboration.
servers:
  - url: https://api.example.com/api/v1
    description: Production placeholder
  - url: http://localhost:8080/api/v1
    description: Local development
paths:
  /health:
    get:
      operationId: getHealth
      tags:
        - Platform
      summary: Check backend health
      responses:
        "200":
          description: Backend is reachable.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"
  /auth/signup:
    post:
      operationId: signup
      tags:
        - Auth
      summary: Create a user account
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SignupRequest"
      responses:
        "201":
          description: Account created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthSessionResponse"
  /auth/login:
    post:
      operationId: login
      tags:
        - Auth
      summary: Start a user session
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "200":
          description: Login succeeded.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthSessionResponse"
  /auth/refresh:
    post:
      operationId: refreshSession
      tags:
        - Auth
      summary: Rotate refresh token and issue a new access token
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RefreshTokenRequest"
      responses:
        "200":
          description: Session refreshed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthSessionResponse"
  /auth/me:
    get:
      operationId: getCurrentUser
      tags:
        - Auth
      summary: Get the current authenticated user
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Current user profile.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserProfile"
  /resumes:
    post:
      operationId: uploadResume
      tags:
        - Resumes
      summary: Upload a resume for async parsing
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required:
                - file
              properties:
                file:
                  type: string
                  format: binary
      responses:
        "202":
          description: Resume upload accepted for processing.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OperationAcceptedResponse"
  /operations/{operationId}:
    get:
      operationId: getOperation
      tags:
        - Operations
      summary: Get async operation status
      security:
        - bearerAuth: []
      parameters:
        - name: operationId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Operation status.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OperationResponse"
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    HealthResponse:
      type: object
      required:
        - status
        - service
        - timestamp
      properties:
        status:
          type: string
          example: UP
        service:
          type: string
          example: candidate-upskill-backend
        timestamp:
          type: string
          format: date-time
    SignupRequest:
      type: object
      required:
        - name
        - email
        - password
      properties:
        name:
          type: string
        email:
          type: string
          format: email
        password:
          type: string
          format: password
          minLength: 8
    LoginRequest:
      type: object
      required:
        - email
        - password
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          format: password
    RefreshTokenRequest:
      type: object
      required:
        - refreshToken
      properties:
        refreshToken:
          type: string
    AuthSessionResponse:
      type: object
      required:
        - accessToken
        - refreshToken
        - user
      properties:
        accessToken:
          type: string
        refreshToken:
          type: string
        user:
          $ref: "#/components/schemas/UserProfile"
    UserProfile:
      type: object
      required:
        - id
        - email
        - name
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
          format: email
        name:
          type: string
    OperationAcceptedResponse:
      type: object
      required:
        - operationId
        - status
        - statusUrl
      properties:
        operationId:
          type: string
          format: uuid
        status:
          type: string
          enum:
            - PENDING
            - RUNNING
            - SUCCEEDED
            - FAILED_RETRYING
            - FAILED_PERMANENT
            - CANCELLED
        statusUrl:
          type: string
    OperationResponse:
      type: object
      required:
        - id
        - type
        - status
        - createdAt
        - updatedAt
      properties:
        id:
          type: string
          format: uuid
        type:
          type: string
          enum:
            - RESUME_PARSE
        status:
          type: string
          enum:
            - PENDING
            - RUNNING
            - SUCCEEDED
            - FAILED_RETRYING
            - FAILED_PERMANENT
            - CANCELLED
        resourceType:
          type: string
          nullable: true
        resourceId:
          type: string
          format: uuid
          nullable: true
        errorCode:
          type: string
          nullable: true
        errorMessage:
          type: string
          nullable: true
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        completedAt:
          type: string
          format: date-time
          nullable: true
